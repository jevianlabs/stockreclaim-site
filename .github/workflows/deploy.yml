# Build the Astro site and publish the static output to the `deploy` branch.
# Hostinger's Git deployment pulls that branch into public_html on a webhook.
# Runs on every push to main, hourly (so blog posts published from the admin
# appear within the hour), and on demand from the Actions tab.
name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BLOG_FEED_URL: https://restock-radar-prod.fly.dev/blog/feed.json
      - name: Publish dist/ to the deploy branch
        run: |
          cd dist
          touch .nojekyll
          git init -q -b deploy
          git config user.name "stockreclaim-bot"
          git config user.email "noreply@stockreclaim.com"
          git add -A
          git commit -q -m "site build $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
