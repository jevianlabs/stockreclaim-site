# Build the Astro site and upload the static output to Hostinger over FTPS.
# Runs on every push to main, hourly (so blog posts published from the admin
# appear within the hour), and on demand from the Actions tab.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   FTP_PASSWORD  — password for the ghdeploy FTP account on Hostinger
# Host and username are non-secret and set below.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://stockreclaim.com
          BLOG_FEED_URL: https://restock-radar-prod.fly.dev/blog/feed.json
      - name: Upload dist/ to Hostinger public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 194.36.184.148
          protocol: ftps
          port: 21
          username: u506525667.ghdeploy
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          # Keep files that aren't part of the build (e.g. anything uploaded
          # directly on the host). Remove this line to mirror exactly.
          dangerous-clean-slate: false
